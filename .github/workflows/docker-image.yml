name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'package.json'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current version from package.json
        id: current_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Get previous version from previous commit
        run: |
          git fetch --depth=2
          git show HEAD^:package.json > old-package.json || echo '{"version":"0.0.0"}' > old-package.json
          echo "OLD_VERSION=$(jq -r .version old-package.json)" >> $GITHUB_ENV

      - name: Compare versions
        id: compare
        run: |
          echo "Current: ${{ steps.current_version.outputs.version }}"
          echo "Previous: $OLD_VERSION"

          if [ "${{ steps.current_version.outputs.version }}" = "$OLD_VERSION" ]; then
            echo "Version unchanged. Skipping build."
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed. Proceeding with build."
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.compare.outputs.build == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image with version tag
        if: steps.compare.outputs.build == 'true'
        run: docker build -f ./Dockerfile . -t ghcr.io/amuveo/amuveo-lp:${{ steps.current_version.outputs.version }}

      - name: Push to GitHub Container Registry
        if: steps.compare.outputs.build == 'true'
        run: docker push ghcr.io/amuveo/amuveo-lp:${{ steps.current_version.outputs.version }}
